name: Build AppImage

on:
  workflow_dispatch:
    inputs:
      disable_unity_build:
        description: Disable CMake unity build (useful for debugging build failures)
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/appimage.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'library/**'
      - 'resources/**'
      - 'scripts/linux/**'
      - 'wiliwili/**'
  push:
    branches:
      - yoga
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      APPDIR: ${{ github.workspace }}/AppDir
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate download hardening invariants
        run: python3 scripts/linux/validate_download_hardening.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            libmpv-dev \
            libwebp-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev \
            libpulse-dev \
            desktop-file-utils \
            ffmpeg \
            file \
            patchelf \
            wget \
            zsync \
            xvfb \
            xauth \
            libgl1-mesa-dri

      - name: Test downloader transfer policy
        shell: bash
        run: |
          set -euxo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Iwiliwili/include \
            scripts/linux/test_download_transfer_policy.cpp -o /tmp/test-download-transfer-policy
          /tmp/test-download-transfer-policy

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-appimage-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-appimage-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-appimage-ccache-

      - name: Configure compiler cache
        shell: bash
        run: |
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "${GITHUB_ENV}"
          ccache --max-size=1G
          ccache --zero-stats

      - name: Update gamepad mappings
        run: |
          BRLS_GLFW='library/borealis/library/lib/extern/glfw'
          cmake -P "${BRLS_GLFW}/CMake/GenerateMappings.cmake" \
            "${BRLS_GLFW}/src/mappings.h.in" \
            "${BRLS_GLFW}/src/mappings.h"

      - name: Verify native dependencies
        shell: bash
        run: |
          set -euxo pipefail
          pkg-config --modversion dbus-1
          pkg-config --modversion mpv
          pkg-config --modversion libwebp
          pkg-config --modversion libcurl
          pkg-config --modversion wayland-client
          pkg-config --modversion xkbcommon

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          UNITY_BUILD=ON
          if [[ '${{ github.event.inputs.disable_unity_build }}' == 'true' ]]; then
            UNITY_BUILD=OFF
          fi

          cmake -S . -B build-appimage -G Ninja \
            -DPLATFORM_DESKTOP=ON \
            -DINSTALL=ON \
            -DUSE_LIBROMFS=ON \
            -DUSE_SYSTEM_CURL=ON \
            -DGLFW_BUILD_WAYLAND=ON \
            -DGLFW_BUILD_X11=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBRLS_UNITY_BUILD="${UNITY_BUILD}" \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=16 \
            -DVERSION_BUILD='${{ github.run_number }}' \
            2>&1 | tee cmake-configure.log

      - name: Show configure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "===== cmake-configure.log ====="
          cat cmake-configure.log 2>/dev/null || true
          echo "===== CMakeError.log ====="
          cat build-appimage/CMakeFiles/CMakeError.log 2>/dev/null || true
          echo "===== CMakeOutput.log (tail) ====="
          tail -n 200 build-appimage/CMakeFiles/CMakeOutput.log 2>/dev/null || true

      - name: Upload configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: appimage-configure-diagnostics-${{ github.run_number }}
          path: |
            cmake-configure.log
            build-appimage/CMakeCache.txt
            build-appimage/CMakeFiles/CMakeError.log
            build-appimage/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and stage AppDir
        run: |
          cmake --build build-appimage --target wiliwili --parallel "$(nproc)"
          DESTDIR="${APPDIR}" cmake --install build-appimage

          test -x "${APPDIR}/usr/bin/wiliwili"
          desktop-file-validate "${APPDIR}/usr/share/applications/cn.xfangfang.wiliwili.desktop"

      - name: Download pinned linuxdeploy
        shell: bash
        run: |
          set -euxo pipefail
          LINUXDEPLOY_VERSION='1-alpha-20251107-1'
          BASE="https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}"
          wget -q "${BASE}/linuxdeploy-x86_64.AppImage" -O linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Bundle runtime and create AppImage
        shell: bash
        run: |
          set -euxo pipefail
          # Keep the native Linux build un-sandboxed so SteamOS can use the host's
          # Mesa/VA-API stack. linuxdeploy bundles ordinary shared libraries, while
          # GPU drivers remain supplied by the host.
          VERSION="$(git describe --tags --always | tr '/ ' '--')"
          OUTPUT="wiliwili-Linux-x86_64-${VERSION}.AppImage"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          export ARCH=x86_64
          export LDAI_OUTPUT="${OUTPUT}"
          export LDAI_VERSION="${VERSION}"
          export LDAI_UPDATE_INFORMATION="gh-releases-zsync|${OWNER}|${REPO}|latest|wiliwili-Linux-x86_64-*.AppImage.zsync"

          ./linuxdeploy-x86_64.AppImage \
            --appdir "${APPDIR}" \
            --executable "${APPDIR}/usr/bin/wiliwili" \
            --executable "$(command -v ffmpeg)" \
            --executable "$(command -v ffprobe)" \
            --desktop-file scripts/linux/cn.xfangfang.wiliwili.desktop \
            --icon-file resources/svg/cn.xfangfang.wiliwili.svg \
            --output appimage

          test -s "${OUTPUT}"
          test -s "${OUTPUT}.zsync"
          chmod +x "${OUTPUT}"
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"
          echo "APPIMAGE_OUTPUT=${OUTPUT}" >> "${GITHUB_ENV}"

      - name: Verify AppImage structure
        shell: bash
        run: |
          rm -rf squashfs-root
          "./${APPIMAGE_OUTPUT}" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/wiliwili
          test -x squashfs-root/usr/bin/ffmpeg
          test -x squashfs-root/usr/bin/ffprobe
          test -f squashfs-root/cn.xfangfang.wiliwili.desktop
          test -f squashfs-root/cn.xfangfang.wiliwili.svg
          LD_LIBRARY_PATH="${PWD}/squashfs-root/usr/lib:${PWD}/squashfs-root/usr/lib/x86_64-linux-gnu" \
            ldd squashfs-root/usr/bin/wiliwili | tee appimage-ldd.txt
          ! grep -q 'not found' appimage-ldd.txt
          squashfs-root/usr/bin/ffmpeg -version | head -n 1
          squashfs-root/usr/bin/ffprobe -version | head -n 1
          file "${APPIMAGE_OUTPUT}"
          du -h "${APPIMAGE_OUTPUT}"
          cat "${APPIMAGE_OUTPUT}.sha256"

      - name: Smoke-test AppImage startup under X11
        shell: bash
        run: |
          set +e
          timeout 10s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "./${APPIMAGE_OUTPUT}" > appimage-startup.log 2>&1
          rc=$?
          set -e
          cat appimage-startup.log
          # A timeout is expected because the GUI main loop keeps running. Any early fatal exit is
          # a regression. This specifically guards the SteamOS crash where MPV_E constructed
          # MPVCore before GLFW had created a current OpenGL context.
          if grep -Eq 'failed to initialize mpv GL context|Cannot query entry point without a current OpenGL|Fatal error' appimage-startup.log; then
            exit 1
          fi
          if [[ ${rc} -ne 0 && ${rc} -ne 124 ]]; then
            echo "AppImage exited unexpectedly with status ${rc}" >&2
            exit "${rc}"
          fi

      - name: Upload AppImage startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: appimage-startup-diagnostics-${{ github.run_number }}
          path: |
            appimage-startup.log
            appimage-ldd.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: wiliwili-AppImage-x86_64-${{ github.run_number }}
          path: |
            ${{ env.APPIMAGE_OUTPUT }}
            ${{ env.APPIMAGE_OUTPUT }}.sha256
            ${{ env.APPIMAGE_OUTPUT }}.zsync
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Publish tagged AppImage release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            ${{ env.APPIMAGE_OUTPUT }}
            ${{ env.APPIMAGE_OUTPUT }}.sha256
            ${{ env.APPIMAGE_OUTPUT }}.zsync
